version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: multimodal_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: multimodal_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multimodal_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: multimodal_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: multimodal_rag_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multimodal_rag
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-in-production-strong-secret-key-32+
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_TTL_SECONDS: 3600
      JWT_REFRESH_TOKEN_TTL_SECONDS: 604800
      AUTH_BACKEND: jwt
      LLM_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: minimax/minimax-m3:free
      UPLOAD_DIR: /app/data/uploads
      DB_PATH: /app/data/rag.sqlite3
      CHAT_HISTORY_DB_PATH: /app/data/chat_history.sqlite3
      PROVIDER_SETTINGS_DB_PATH: /app/data/provider_settings.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data:
